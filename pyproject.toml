[project]
name = "zavashop-stockout-fleet"
version = "0.1.0"
description = "Packaged ZavaShop stock-out response fleet for AKS and Azure Container Apps labs."
requires-python = ">=3.11"
dependencies = [
    "agent-framework-core>=1.8.1",
    "agent-framework-github-copilot>=1.0.0rc1",
    "azure-identity>=1.15",
    "azure-keyvault-secrets>=4.8",
    "fastapi",
    "httpx",
    "mcp>=1,<2",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "pydantic>=2",
    "pydantic-settings",
    "structlog",
    "uvicorn",
]

[dependency-groups]
dev = [
    "bandit",
    "pip-audit",
    "poethepoet",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "PL", "RUF"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN401"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.poe.tasks]
check = { shell = "ruff check src tests && ruff format --check src tests && pyright src tests && pytest -q --cov=src/agents --cov-report=term-missing --cov-fail-under=80" }
audit = { shell = "bandit -q -c pyproject.toml -r src && pip-audit --strict" }
evals = "python -m tests.evals.run_evals"
evals-docker = "python -m tests.evals.run_docker_evals"

[tool.bandit]
skips = ["B104", "B105"]
