name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Quality, security, and deterministic evaluations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Check quality and coverage
        run: uv run poe check

      - name: Audit dependencies and source
        run: uv run poe audit

      - name: Run deterministic evaluations
        run: uv run poe evals
